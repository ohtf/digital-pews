# Generated by s/sync-ohtf-theme. Keep project content, nav and licensing outside this file.
theme:
  variant: modern
  language: en
  logo: ohtf/ohtf-mark.svg
  favicon: ohtf/ohtf-mark.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to light mode

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ohtf
      name: OHTF on GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/ohtfdotorg
      name: OHTF on X
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/openhealthtech.bsky.social
      name: OHTF on Bluesky
    - icon: lucide/mail
      link: mailto:hello@openhealthtechnology.org
      name: Email OHTF

extra_css:
  - ohtf/ohtf.css
